# SAC baseline on LunarLanderContinuous-v3.
# Hyperparameters from rl-baselines3-zoo, tuned for SAC on continuous control.

algo: sac
env_id: LunarLanderContinuous-v3
n_envs: 1                     # SAC is off-policy → single env is standard
vec_type: dummy
total_timesteps: 500_000
device: mps                   # Q-network + actor are large enough to benefit

hyperparameters:
  learning_rate: 7.3e-4
  buffer_size: 1_000_000
  batch_size: 256
  tau: 0.01
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  learning_starts: 10_000
  ent_coef: auto
  target_update_interval: 1
  policy: MlpPolicy
  policy_kwargs:
    net_arch: [400, 300]

normalize_obs: false
normalize_reward: false

eval_freq: 5_000
n_eval_episodes: 20
checkpoint_freq: 50_000

wrappers: null
